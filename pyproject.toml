[project]
name = "ai-doc-assistant"
version = "0.1.0"
description = "AI Product Document Assistant (RAG demo)"
requires-python = ">=3.12"

dependencies = [
    "fastapi==0.110.0",
    "uvicorn==0.29.0",
    "jinja2>=3.1.0",
    "numpy==1.26.4",
    "python-docx==1.1.0",
    "python-multipart==0.0.9",
    "openai==1.14.3",
    "python-dotenv==1.0.1",
    "requests==2.31.0",
    "upstash-redis>=1.7.0",
]

[project.optional-dependencies]
local-embeddings = [
    "sentence-transformers==2.6.1",
    "transformers==4.38.2",
    "torch==2.2.2",
]
